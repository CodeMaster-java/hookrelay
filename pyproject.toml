[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hookrelay"
version = "0.2.0"
description = "Reliable webhook processing for Python: automatic retries with backoff, dead-letter queue and idempotency."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Robson Carvalho" }]
keywords = ["webhook", "retry", "dead-letter-queue", "fastapi", "asyncio", "reliability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
postgres = ["sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29"]
redis = ["redis>=5.0"]
sqlite = ["sqlalchemy[asyncio]>=2.0", "aiosqlite>=0.19"]
fastapi = ["fastapi>=0.100"]
metrics = ["prometheus-client>=0.20"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.19",
    "redis>=5.0",
    "fastapi>=0.100",
    "prometheus-client>=0.20",
]

[project.scripts]
hookrelay = "hookrelay.cli:main"

[project.urls]
Homepage = "https://github.com/CodeMaster-Java/hookrelay"
Repository = "https://github.com/CodeMaster-Java/hookrelay"
Issues = "https://github.com/CodeMaster-Java/hookrelay/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hookrelay"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
